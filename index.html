<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nail Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  background: linear-gradient(135deg, #ffd6e0, #ffc0cb, #fff);
  color: #b03060;
}

.container {
  text-align: center;
  padding: 60px 20px;
}

h1 {
  font-size: 42px;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  background: #ff6f91;
  color: white;
  cursor: pointer;
  font-size: 16px;
  margin-top: 10px;
}

button:hover {
  background: #ff4f7b;
}

.form-box {
  display: none;
  background: white;
  padding: 25px;
  margin: 30px auto;
  width: 320px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

input, select {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #eee;
}

label {
  display: block;
  text-align: left;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">
  <h1>💅 Book Your Nail Appointment</h1>
  <p>Soft glam nails, your way ✨</p>
  <button onclick="openForm()">Book Now</button>

  <div class="form-box" id="formBox">

    <form action="https://formspree.io/f/mgodoepp" method="POST" onsubmit="return handleSubmit(event)">

      <h3>Your Info</h3>
      <input type="text" id="name" name="name" placeholder="Your Name" required>
      <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>

      <h3>Select Service</h3>
      <select id="service" name="service">
        <option value="Basic Gel Manicure">Basic Gel Manicure</option>
        <option value="Gel-X Extensions">Gel-X Extensions</option>
        <option value="Gel-X w/ Design">Gel-X w/ Intricate Design</option>
        <option value="Clear Coat + Cuticle Work">Clear Coat + Cuticle Work</option>
      </select>

      <h3>Add-ons</h3>
      <label><input type="checkbox" value="Soak Off ($5)"> Soak Off ($5)</label>
      <label><input type="checkbox" value="Handmade Charm ($5)"> Handmade Charm ($5)</label>
      <label><input type="checkbox" value="Intricate Design ($10)"> Intricate Design ($10)</label>

      <input type="hidden" name="addons" id="addonsField">

      <h3>Date</h3>
      <input type="date" id="date" name="date" required>

      <h3>Time Slot</h3>
      <select id="time" name="time" required>
        <option value="">Select a time</option>
        <option value="16:30">4:30 PM</option>
        <option value="17:00">5:00 PM</option>
        <option value="17:30">5:30 PM</option>
        <option value="18:00">6:00 PM</option>
        <option value="18:30">6:30 PM</option>
      </select>

      <button type="submit">Confirm Booking</button>

    </form>

  </div>
</div>

<script>
function openForm() {
  document.getElementById("formBox").style.display = "block";
}

function handleSubmit(event) {
  event.preventDefault();

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const service = document.getElementById("service").value;
  const date = document.getElementById("date").value;
  const time = document.getElementById("time").value;

  if (!name || !phone || !date || !time) {
    alert("Please fill out all fields 💕");
    return false;
  }

  const addons = [];
  document.querySelectorAll("input[type=checkbox]:checked")
    .forEach(el => addons.push(el.value));

  document.getElementById("addonsField").value = addons.join(", ") || "None";

  // ---- Calendar (.ics file) ----
  const startDate = new Date(`${date}T${time}:00`);
  const endDate = new Date(startDate.getTime() + 60 * 60 * 1000);

  function formatICS(d) {
    return d.toISOString().replace(/[-:]/g, "").split(".")[0];
  }

  const eventDetails = `
BEGIN:VCALENDAR
VERSION:2.0
BEGIN:VEVENT
SUMMARY:Nail Appointment - ${service}
DESCRIPTION:Client: ${name} | Phone: ${phone} | Add-ons: ${addons.join(", ") || "None"}
DTSTART:${formatICS(startDate)}
DTEND:${formatICS(endDate)}
END:VEVENT
END:VCALENDAR
`;

  const blob = new Blob([eventDetails], { type: "text/calendar" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "appointment.ics";
  link.click();

  // ---- Send to Formspree ----
  event.target.submit();

  return false;
}
</script>

</body>
</html>
